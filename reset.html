<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>清除旧版缓存</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f7f3;
        color: #17212b;
        font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      }
      main {
        width: min(92vw, 520px);
        padding: 24px;
        border: 1px solid #dbe5dd;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 18px 44px rgba(26, 47, 56, 0.1);
      }
      h1 {
        margin: 0 0 12px;
      }
      p {
        color: #66737a;
        line-height: 1.7;
      }
      a {
        display: inline-block;
        margin-top: 12px;
        padding: 12px 14px;
        border-radius: 8px;
        background: #146c63;
        color: #fff;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>正在清除旧版缓存</h1>
      <p id="status">请稍等，清除完成后会自动打开新版音标 App。</p>
      <a href="./index.html?v=ipa-only-2">手动打开新版</a>
    </main>
    <script>
      async function resetApp() {
        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }
          localStorage.clear();
          document.querySelector("#status").textContent = "旧版缓存已清除，正在打开新版。";
        } catch (error) {
          document.querySelector("#status").textContent = "缓存清除遇到问题，请点击下方按钮手动打开新版。";
        } finally {
          setTimeout(() => {
            location.replace("./index.html?v=ipa-only-2");
          }, 900);
        }
      }
      resetApp();
    </script>
  </body>
</html>
